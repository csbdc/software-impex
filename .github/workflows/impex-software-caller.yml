name: Impex software

on:
  push:

permissions:
  contents: read
  packages: read
  security-events: write

jobs:
  determine:
    runs-on: ubuntu-latest
    outputs:
      software_folders: ${{ steps.set.outputs.software_folders }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - id: set
        run: |
          folders=$(find . -mindepth 1 -maxdepth 1 -type d ! -name '.*' ! -name 'actions-runner' -printf '%f\n' \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "software_folders=$folders" >> "$GITHUB_OUTPUT"
  impex:
    needs: determine
    strategy:
      matrix:
        software_folders: ${{ fromJSON(needs.determine.outputs.software_folders) }}
    uses: ./.github/workflows/impex-software.yml
    with:
      software_folder: ${{ matrix.software_folders }}
