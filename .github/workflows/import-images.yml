name: Scan and Import Images to Harbor

on:
  workflow_dispatch:
  push:

jobs:
  scan-and-push:
    name: Scan archives and import passing images
    runs-on: software-impex-runners
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check runner prerequisites
        shell: bash
        run: |
          set -euo pipefail

          command -v docker
          command -v trivy
          docker info
          trivy --version

          echo "Runner prerequisites verified."