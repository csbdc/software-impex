on:
  workflow_call:
    inputs:
      software_folder:
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: pull
        working-directory: ${{ inputs.software_folder }}
        run: |
          cat software.yml
          