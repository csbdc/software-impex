name: impex image

on:
  workflow_dispatch:
  push:

jobs:
  pull:
    name: Pull image binaries
    timeout-minutes: 90
    runs-on: software-impex-runners
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - run: cat /home/runner/run.sh
      - name: Configure Harbor credentials for BuildKit
        env:
          HARBOR_USER: ${{ secrets.HARBOR_USER }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          DOCKER_CONFIG: /home/runner/.docker
        run: |
          : "${HARBOR_USER:?HARBOR_USER is required}"
          : "${HARBOR_PASSWORD:?HARBOR_PASSWORD is required}"
          umask 077
          mkdir -p "$DOCKER_CONFIG"
          auth="$(printf '%s:%s' "$HARBOR_USER" "$HARBOR_PASSWORD" | base64 -w0)"
          printf '{"auths":{"harbor.home.arpa":{"auth":"%s"}}}\n' "$auth" > "$DOCKER_CONFIG/config.json"
      - name: build image
        env:
          DOCKER_CONFIG: /home/runner/.docker
        run: |
          cd actions-runner

          buildctl build \
            --frontend dockerfile.v0 \
            --local context=. \
            --local dockerfile=. \
            --registry-auth-tlscontext host=harbor.home.arpa,insecure=false,ca=/etc/buildkit/certs/ca.crt \
            --output type=image,name=harbor.home.arpa/library/actions-runner-impex:latest,push=true
