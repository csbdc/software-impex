name: impex image

on:
  workflow_dispatch:
  push:

jobs:
  pull:
    name: Pull image binaries
    timeout-minutes: 90
    runs-on: software-impex-runners
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - run: cat /home/runner/run.sh
      - name: build image
        run: |
          cd actions-runner

          buildctl build \
            --frontend dockerfile.v0 \
            --local context=. \
            --local dockerfile=. \
            --output type=image,name=harbor-registry.harbor.svc.cluster.local:5000/library/actions-runner-impex:latest,push=true,registry.insecure=true