name: impex image

on:
  workflow_dispatch:
  push:

jobs:
  pull:
    name: Pull image binaries
    timeout-minutes: 90
    runs-on: software-impex-runners
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: build image
        run: |
          cd actions-runner
          buildctl build \
            --frontend dockerfile.v0 \
            --local context=. \
            --local dockerfile=. \
            --output type=type=oci,dest=image.tar