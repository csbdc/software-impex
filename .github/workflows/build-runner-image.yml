  scan-malware:
    # needs: build
    name: Scan for malware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install ClamAV
        run: |
          sudo apt update && sudo apt install clamav -y; \
          sudo usermod -aG clamav runner;\
      - name: Grab clamav db
        run: sudo freshclam --config-file=./actions-runner/freshclam.conf
      - name: Download built image
        uses: actions/download-artifact@v8
        with:
          name: actions-runner
          path: actions-runner.tar
      - name: Scan Image with ClamAV
        run: clamscan --infected --recursive actions-runner.tar

