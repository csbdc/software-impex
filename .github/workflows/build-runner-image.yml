name: Build impex runner image

on:
  workflow_dispatch:

jobs:
  pull:
    name: Pull image binaries
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image
        run: |
          docker buildx build \
            -t actions-runner-buildkit:latest \
            --output type=oci,dest=image.tar .
      - uses: actions/upload-artifact@v7
        with:
          name: actions-runner-buildkit
          path: image.tar