name: Build impex runner image

on:
  workflow_dispatch:
  push:

jobs:
  pull:
    name: Pull image binaries
    timeout-minutes: 90
    runs-on: prereq-build-runners
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Pull Trivy binary
        shell: bash
        env:
          TRIVY_VERSION: "0.76.0"
        run: |
          set -euo pipefail

          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          checksums="trivy_${TRIVY_VERSION}_checksums.txt"
          base_url="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"

          curl -f -LO "${base_url}/${archive}"
          curl -f -LO "${base_url}/${checksums}"

          checksum_line=$(grep -F " ${archive}" "${checksums}")

          if [[ -z "${checksum_line}" ]]; then
            echo "ERROR: Checksum for ${archive} not found."
            exit 1
          fi

          printf '%s\n' "${checksum_line} ${archive}"
          printf '%s\n' "${checksum_line}" | sha256sum --check -

          tar -xzf "${archive}" trivy
      - name: Pull Rootlesskit binary
        shell: bash
        env:
          ROOTLESSKIT_VERSION: "3.3.0"
        run: |
          set -euo pipefail

          archive="rootlesskit-x86_64.tar.gz"
          checksums="SHA256SUMS"
          base_url="https://github.com/rootless-containers/rootlesskit/releases/download/v${ROOTLESSKIT_VERSION}"

          curl -f -LO "${base_url}/${archive}"
          curl -f -LO "${base_url}/${checksums}"

          checksum_line=$(grep -F " ${archive}" "${checksums}")

          if [[ -z "${checksum_line}" ]]; then
            echo "ERROR: Checksum for ${archive} not found."
            exit 1
          fi

          printf '%s\n' "${checksum_line} ${archive}"
          printf '%s\n' "${checksum_line}" | sha256sum --check -

          tar -xzf "${archive}"
      - name: Pull Runc binary
        shell: bash
        env:
          RUNC_VERSION: "1.5.2"
        run: |
          set -euo pipefail

          archive="runc.amd64"
          checksums="runc.sha256sum"

          base_url="https://github.com/opencontainers/runc/releases/download/v${RUNC_VERSION}"

          curl -f -LO "${base_url}/${archive}"
          curl -f -LO "${base_url}/${checksums}"

          checksum_line=$(grep -F " ${archive}" "${checksums}")

          if [[ -z "${checksum_line}" ]]; then
            echo "ERROR: Checksum for ${archive} not found."
            exit 1
          fi

          printf '%s\n' "${checksum_line} ${archive}"
          printf '%s\n' "${checksum_line}" | sha256sum --check -
      - name: Pull Buildkit binary
        shell: bash
        env:
          BUILDKIT_VERSION: "0.34.0"
        run: |
          set -euo pipefail

          archive="buildkit-v${BUILDKIT_VERSION}.linux-amd64.tar.gz"
          checksums="buildkit-v${BUILDKIT_VERSION}.linux-amd64.provenance.json"

          base_url="https://github.com/moby/buildkit/releases/download/v${BUILDKIT_VERSION}"
          curl -f -LO "${base_url}/${archive}"
          curl -f -LO "${base_url}/${checksums}"

          checksum_line=$(jq -r '.subject[].digest.sha256' ${checksums})

          if [[ -z "${checksum_line}" ]]; then
            echo "ERROR: Checksum for ${archive} not found."
            exit 1
          fi

          printf '%s\n' "${checksum_line} ${archive}"
          printf '%s\n' "${checksum_line} ${archive}" | sha256sum --check -

          tar -xzf "${archive}"
      - name: Install binaries
        shell: bash
        run: |
          set -euo pipefail

          sudo install -m 755 rootlesskit /usr/local/bin/rootlesskit
          sudo install -m 755 runc.amd64 /usr/local/bin/runc
          sudo install -m 755 bin/buildkitd /usr/local/bin/buildkitd
          sudo install -m 755 bin/buildctl /usr/local/bin/buildctl
          sudo install -m 755 trivy /usr/local/bin/trivy

          sudo apt-get update -y && sudo apt-get install -y --no-install-recommends uidmap

          sudo mkdir -p /run/buildkit     

      - name: Diagnose rootless prerequisites
        shell: bash
        run: |
          set -euxo pipefail

          id
          echo "PATH=$PATH"

          command -v newuidmap
          command -v newgidmap

          ls -l "$(command -v newuidmap)"
          ls -l "$(command -v newgidmap)"

          echo "--- subordinate UID mappings ---"
          cat /etc/subuid || true

          echo "--- subordinate GID mappings ---"
          cat /etc/subgid || true

          echo "--- user namespace configuration ---"
          cat /proc/sys/user/max_user_namespaces || true

          echo "--- user namespace test ---"
          unshare -Ur true


      - name: Start rootless BuildKit
        shell: bash
        run: |
          set -euo pipefail

          export BUILDKIT_HOST="unix://${RUNNER_TEMP}/buildkitd.sock"

          mkdir -p "$HOME/.local/share/buildkit"

          nohup /usr/local/bin/rootlesskit \
            --copy-up=/etc \
            --disable-host-loopback \
            /usr/local/bin/buildkitd \
            --addr "$BUILDKIT_HOST" \
            --root "$HOME/.local/share/buildkit" \
            --oci-worker-no-process-sandbox \
            --oci-worker-snapshotter=native \
            > "$RUNNER_TEMP/buildkitd.log" 2>&1 < /dev/null &

          for i in $(seq 1 30); do
            if /usr/local/bin/buildctl \
              --addr "$BUILDKIT_HOST" debug workers >/dev/null 2>&1; then
              break
            fi

            if [[ "$i" -eq 30 ]]; then
              cat "$RUNNER_TEMP/buildkitd.log"
              exit 1
            fi

            sleep 1
          done

          /usr/local/bin/buildctl --addr "$BUILDKIT_HOST" build \
            --frontend dockerfile.v0 \
            --local context=. \
            --local dockerfile=. \
            --opt filename=dockerfile \
            --output type=oci,dest=image.tar

      - uses: actions/upload-artifact@v7
        with:
          name: my-artifact
          path: image.tar
