  scan-malware:
    # needs: build
    name: Scan for malware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install ClamAV
        run: |
          set -euo pipefail
          sudo apt update
          sudo apt install clamav clamav-freshclam -y
          sudo usermod -aG clamav runner
          sudo mkdir -p /usr/local/share/clamav
          sudo chown runner:runner /usr/local/share/clamav
      - name: Grab ClamAV db
        run: |
          # The custom config sets DatabaseOwner; run as root so freshclam can
          # apply that ownership while writing the database.
          sudo freshclam --config-file="$PWD/actions-runner/freshclam.conf" --verbose
      - name: Download built image
        uses: actions/download-artifact@v8
        with:
          name: actions-runner
          path: actions-runner.tar
      - name: Scan Image with ClamAV
        run: clamscan --infected --recursive actions-runner.tar

